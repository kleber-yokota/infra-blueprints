services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.2
    container_name: clickhouse_db
    restart: always
    env_file:
      - .env
    environment:
      - CLICKHOUSE_DB=clickhouse_warehouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      # Mapeado diretamente para o destino correto (config.yaml substitui o config.xml padrão)
      - ./configs/config.yaml:/etc/clickhouse-server/config.yaml
      # Mantido na pasta users.d, o ClickHouse lerá automaticamente
      - ./configs/users.yaml:/etc/clickhouse-server/users.d/users.yaml
      - ./configs/storage.yaml:/etc/clickhouse-server/config.d/s3.yaml:ro
    networks:
      - internal
    healthcheck:
      # Modificado para usar curl, que é mais garantido estar presente na imagem
      test: ["CMD", "curl", "-f", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  internal:
    external: true
