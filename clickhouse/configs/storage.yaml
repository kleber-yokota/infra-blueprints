storage_configuration:
  disks:
    garage_s3_disk:
      type: s3
      endpoint:
        - '@from_env': GARAGE_ENDPOINT
      access_key_id:
        - '@from_env': GARAGE_ACCESS_KEY
      secret_access_key:
        - '@from_env': GARAGE_SECRET_KEY
      use_path_style_url: true
      region: garage
      metadata_path: "/var/lib/clickhouse/disks/garage_s3_disk/"
      cache:
        path: "/var/lib/clickhouse/disks/garage_s3_disk/cache/"
        max_size: "10Gi"
  policies:
    s3_main:
      volumes:
        main:
          disk: garage_s3_disk
